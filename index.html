<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>単語帳（英語・中国語）</title>
<style>
:root{
  --bg:#1e1e1e; --card:#2d2d2d; --border:#404040; --text:#e0e0e0; --muted:#a0a0a0;
  --accent:#4ec9b0; --success:#b5cea8; --warning:#f14c4c; --normal:#569cd6; --input:#3c3c3c;
}
body.rpg{--bg:#0f0f1a;--card:#1a1a2e;--border:#3b3b6d;--text:#f0f0f5;--muted:#9494b8;--accent:#ffd700;--success:#00ffcc;--warning:#ff4757;--normal:#3498db;--input:#242438}
body.souls{--bg:#12100e;--card:#1c1917;--border:#4a413b;--text:#e6dbc9;--muted:#8c8275;--accent:#e65100;--success:#48c9b0;--warning:#a93226;--normal:#d35400;--input:#282420}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{padding:10px 14px 4px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-size:17px;margin:0}
select,input,textarea{background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px;font-size:15px}
.tabs{display:flex;gap:6px;padding:8px 14px 0}
.tabs button{flex:1;padding:11px 4px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:15px;font-weight:700}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
main{flex:1;display:flex;flex-direction:column;padding:12px 14px;gap:10px;max-width:720px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 20px;text-align:center;cursor:pointer;user-select:none;position:relative}
.badge{position:absolute;top:12px;left:16px;font-size:12px;font-weight:700;color:var(--accent)}
.timer{position:absolute;top:12px;right:16px;font-size:14px;font-weight:700;color:var(--warning)}
.word{font-size:34px;font-weight:800;line-height:1.3;word-break:break-word}
.reading{font-size:19px;color:var(--accent);margin-top:12px;white-space:pre-line}
.meaning{font-size:21px;color:var(--accent);margin-top:8px;white-space:pre-line;line-height:1.5}
.example{font-size:16px;color:var(--muted);margin-top:16px;white-space:pre-line;line-height:1.6}
.hint{font-size:14px;color:var(--muted)}
.grades{display:flex;gap:8px}
.grades button{flex:1;padding:16px 4px;border-radius:12px;border:1px solid var(--border);background:var(--card);font-size:16px;font-weight:800}
.g-hard{color:var(--warning)} .g-normal{color:var(--normal)} .g-easy{color:var(--success)}
.grades button:disabled{opacity:.35}
.stats{font-size:13px;color:var(--accent);font-weight:700;padding:0 2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-weight:700}
label.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--accent);font-weight:700}
.view{display:none;flex-direction:column;gap:10px}
.view.on{display:flex}
.list{display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.item b{font-size:16px}
.item .sub{color:var(--muted);font-size:13px;margin-top:2px;line-height:1.5}
.item .meta{color:var(--accent);font-size:12px;margin-top:2px}
form.add{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
form.add button{background:var(--input);color:var(--accent);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:15px;font-weight:800}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.danger{color:var(--warning)!important}
.ret{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.ret .rt{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.ret .rr{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}
.ret .rl{width:86px;color:var(--muted);flex:none}
.ret .rb{flex:1;background:var(--input);border-radius:6px;height:10px;overflow:hidden}
.ret .rf{height:100%;background:var(--accent)}
.ret .rc{width:44px;text-align:right;color:var(--accent);font-weight:700;flex:none}
.pill{border:1px solid var(--border);background:var(--card);color:var(--accent);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;z-index:90;padding:20px 12px}
.modal.on{display:flex}
.modal-card{position:relative;width:100%;max-width:520px;max-height:88vh;overflow-y:auto}
.modal-card form.add{box-shadow:0 8px 30px rgba(0,0,0,.5)}
.modal-x{position:absolute;top:4px;right:10px;background:none;border:none;color:var(--muted);font-size:26px;line-height:1;cursor:pointer;z-index:2;padding:6px}
.speak-row{display:flex;gap:8px}
.speak-row button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--accent);font-size:14px;font-weight:700;cursor:pointer}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;font-size:30px;line-height:1;background:var(--accent);color:#141414;border:none;box-shadow:0 4px 14px rgba(0,0,0,.45);z-index:50;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>📖 単語帳</h1>
  <button id="syncPill" class="pill">☁ 未設定</button>
  <div class="row" style="align-items:center">
    <label class="chk"><input type="checkbox" id="timerChk" style="width:20px;height:20px"> ⏳30秒</label>
    <label class="chk"><input type="checkbox" id="listenChk" style="width:20px;height:20px"> 🎧 聴き取り</label>
    <select id="themeSel">
      <option value="">🌙 モダンダーク</option>
      <option value="rpg">🌟 レトロRPG</option>
      <option value="souls">🏰 ダークソウル</option>
    </select>
  </div>
</header>

<div class="tabs">
  <button data-mode="en" class="on">英語</button>
  <button data-mode="cn">中国語</button>
  <button data-mode="mix">🔄 混合</button>
  <button data-mode="list">⚙ 一覧</button>
</div>

<main>
  <section id="studyView" class="view on">
    <div class="card" id="card">
      <div class="badge" id="badge"></div>
      <div class="timer" id="timer"></div>
      <div class="word" id="word">---</div>
      <div class="reading" id="reading"></div>
      <div class="meaning" id="meaning"></div>
      <div class="example" id="example"></div>
      <div class="hint" id="hint">タップで意味を表示</div>
    </div>
    <div class="speak-row">
      <button id="speakWord" style="display:none">🔊 単語</button>
      <button id="speakEx" style="display:none">🔊 例文</button>
    </div>
    <div class="grades">
      <button class="g-hard" id="btnHard">難しい</button>
      <button class="g-normal" id="btnNormal">普通</button>
      <button class="g-easy" id="btnEasy">簡単</button>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <section id="listView" class="view">
    <input id="search" type="search" placeholder="🔍 検索（単語・意味・例文）">
    <div class="ret" id="retention"></div>
    <div class="row">
      <button id="deckEn">英語の単語</button>
      <button id="deckCn">中国語の単語</button>
      <button id="leechFilter">⚠ 苦手だけ表示</button>
      <button id="leechStudy">⚠ 苦手だけ学習</button>
    </div>
    <div class="list" id="list"></div>
    <div class="row">
      <button id="expCsv">📤 CSV出力</button>
      <button id="expJson">📤 JSON出力（全データ）</button>
      <button id="impJsonBtn">📥 JSON取込</button>
      <input type="file" id="impJson" accept=".json,application/json" style="display:none">
      <button id="resetBtn">☁ GitHubから再取得</button>
    </div>

    <form class="add" id="ghForm">
      <b>☁ GitHub同期</b> <span class="note">同期方式 v3.1 ／ 機能 v4（穴埋め・苦手・定着度）</span>
      <input id="ghOwner" placeholder="GitHubユーザー名（owner）">
      <input id="ghRepo" placeholder="リポジトリ名（Private）">
      <input id="ghToken" type="password" placeholder="トークン（Contents: Read and write）">
      <input id="ghBranch" placeholder="ブランチ（空欄なら main）">
      <div class="row">
        <button type="button" id="ghSave">設定を保存</button>
        <button type="button" id="ghSyncNow">今すぐ同期</button>
      </div>
      <div class="note" id="ghStatus">未設定：ローカル保存のみで動作中</div>
    </form>
  </section>
</main>
<div id="addModal" class="modal">
  <div class="modal-card">
    <button id="addClose" class="modal-x" aria-label="閉じる">×</button>
    <form class="add" id="addForm">
      <b id="addTitle">＋ 単語を追加</b>
      <input id="fWord" placeholder="単語" required>
      <input id="fReading" placeholder="ピンイン（中国語のみ）">
      <input id="fMeaning" placeholder="意味" required>
      <input id="fExample" placeholder="例文">
      <input id="fExReading" placeholder="例文ピンイン（中国語のみ）">
      <button type="submit">追加する</button>
    </form>
  </div>
</div>
<button id="fabAdd" class="fab" title="単語を追加">＋</button>

<script defer src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
<script>
const INITIAL = { en: [], cn: [] };
const LS_KEY = 'vocabAppDataV1';
let data;
try { data = JSON.parse(localStorage.getItem(LS_KEY)) || null; } catch(e){ data = null; }
if (!data || !data.en || !data.cn) { data = JSON.parse(JSON.stringify(INITIAL)); save(); }
function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch(e){} }
function todayStr(d){ d = d || new Date(); const p = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function addDays(n){ const d = new Date(); d.setDate(d.getDate()+n); return todayStr(d); }

let mode = 'en';           // en | cn | mix | list
let listDeck = 'en';
let current = null;        // {deck, item}
let shown = false;
let listenMode = false;
try { listenMode = localStorage.getItem('vocabListen') === '1'; } catch(e){}
let timerId = null, timeLeft = 30;

const $ = id => document.getElementById(id);
const decks = () => mode === 'mix' ? ['en','cn'] : [mode];
function dueItems(){
  if (leechMode){
    let out = [];
    ['en','cn'].forEach(dk => data[dk].forEach(it => { if ((it.lapses || 0) >= LEECH_MIN) out.push({deck: dk, item: it}); }));
    return out;
  }
  const t = todayStr(); let out = [];
  decks().forEach(dk => data[dk].forEach(it => { if ((it.next_review || t) <= t) out.push({deck: dk, item: it}); }));
  return out;
}
function statsText(){
  if (leechMode){
    let n = 0; ['en','cn'].forEach(dk => data[dk].forEach(it => { if ((it.lapses || 0) >= LEECH_MIN) n++; }));
    return '⚠ 苦手ドリル（難しい×' + LEECH_MIN + '以上）: ' + n + '件';
  }
  const t = todayStr();
  let due = 0, total = 0;
  decks().forEach(dk => { total += data[dk].length; due += data[dk].filter(it => (it.next_review || t) <= t).length; });
  return '⚔ 本日の要復習: ' + due + '件 ／ 総単語数: ' + total + '件';
}
function stopTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } $('timer').textContent=''; }
function startTimer(){
  stopTimer(); timeLeft = 30; $('timer').textContent = '⏳ 00:30';
  timerId = setInterval(() => {
    timeLeft--;
    if (timeLeft > 0){ $('timer').textContent = '⏳ 00:' + String(timeLeft).padStart(2,'0'); }
    else { stopTimer(); $('timer').textContent = '⏳ タイムアップ！'; grade('hard'); }
  }, 1000);
}
function nextCard(){
  stopTimer(); shown = false;
  const due = dueItems();
  const totalAll = data.en.length + data.cn.length;
  if (!due.length){
    current = null; currentCloze = null; $('word').style.fontSize = '';
    if (leechMode){
      $('badge').textContent = ''; $('word').textContent = '🎉 苦手単語はありません';
      $('reading').textContent = ''; $('meaning').textContent = ''; $('example').textContent = '';
      $('hint').textContent = '';
      setGrades(false); $('stats').textContent = statsText(); stopTimer(); updateSpeakBtns(); return;
    }
    if (totalAll === 0){
      $('badge').textContent = ''; $('word').textContent = '単語がありません';
      $('reading').textContent = ''; $('meaning').textContent = ''; $('example').textContent = '';
      $('hint').textContent = ghReady() ? '☁ 同期中…少し待ってね' : '「⚙ 一覧」タブで GitHub同期を設定してね';
      setGrades(false); $('stats').textContent = statsText(); stopTimer(); updateSpeakBtns(); return;
    }
    $('badge').textContent = ''; $('word').textContent = '🎉 TODAY CLEAR!';
    $('reading').textContent = ''; $('meaning').textContent = ''; $('example').textContent = '';
    $('hint').textContent = '今日の学習は終了です！明日また復習しましょう。';
    setGrades(false);
  } else {
    let pool = due;
    if (current && due.length > 1) pool = due.filter(x => x.item !== current.item);
    current = pool[Math.floor(Math.random() * pool.length)];
    const it = current.item;
    currentCloze = makeCloze(it, current.deck);
    const mixLabel = mode === 'mix' || leechMode ? ('📂 [' + (current.deck === 'en' ? '英語' : '中国語') + ']') : '';
    if (listenMode){
      showListeningFront();
    } else if (currentCloze){
      $('badge').textContent = (leechMode ? '⚠ 苦手 ' : '') + '🕳 穴埋め ' + mixLabel;
      $('word').textContent = currentCloze;
      $('word').style.fontSize = '23px';
      $('reading').textContent = ''; $('meaning').textContent = it.meaning || ''; $('meaning').style.fontSize = '17px'; $('example').textContent = '';
      $('hint').textContent = 'タップで答え合わせ';
    } else {
      $('badge').textContent = (leechMode ? '⚠ 苦手 ' : '') + mixLabel;
      $('word').textContent = it.word;
      $('word').style.fontSize = '';
      $('reading').textContent = ''; $('meaning').textContent = ''; $('meaning').style.fontSize = ''; $('example').textContent = '';
      $('hint').textContent = 'タップで意味を表示';
    }
    setGrades(true);
    if ($('timerChk').checked) startTimer();
  }
  $('stats').textContent = statsText();
  updateSpeakBtns();
  autoSpeakListening();
}
function setGrades(on){ ['btnHard','btnNormal','btnEasy'].forEach(id => $(id).disabled = !on); }
function toggle(){
  if (!current) return;
  setTimeout(updateSpeakBtns, 0);
  shown = !shown; const it = current.item;
  if (!shown && listenMode){ showListeningFront(); return; }
  if (shown && listenMode && !currentCloze){ $('word').textContent = it.word; $('word').style.fontSize = ''; }
  if (shown && currentCloze){
    $('word').textContent = it.word; $('word').style.fontSize = '';
    $('reading').textContent = (current.deck === 'cn' && it.reading) ? it.reading : '';
    $('meaning').textContent = it.meaning || '';
    let ex = '';
    if (it.example){ ex = 'Ex) ' + it.example; if (current.deck === 'cn' && it.example_reading) ex += '\n' + it.example_reading; }
    $('example').textContent = ex;
    $('hint').textContent = '';
    return;
  }
  if (shown){
    $('reading').textContent = (current.deck === 'cn' && it.reading) ? it.reading : '';
    $('meaning').textContent = it.meaning || '';
    let ex = '';
    if (it.example){ ex = 'Ex) ' + it.example; if (current.deck === 'cn' && it.example_reading) ex += '\n' + it.example_reading; }
    $('example').textContent = ex;
    $('hint').textContent = '';
  } else {
    if (currentCloze){
      $('word').textContent = currentCloze; $('word').style.fontSize = '23px';
      $('reading').textContent = ''; $('meaning').textContent = it.meaning || ''; $('meaning').style.fontSize = '17px'; $('example').textContent = '';
      $('hint').textContent = 'タップで答え合わせ';
    } else {
      $('reading').textContent = ''; $('meaning').textContent = ''; $('example').textContent = '';
      $('hint').textContent = 'タップで意味を表示';
    }
  }
}
function grade(kind){
  if (!current) return;
  stopTimer();
  const it = current.item; const cur = it.interval || 0;
  if (kind === 'hard'){ it.lapses = (it.lapses || 0) + 1; it.interval = cur <= 1 ? 0 : Math.floor(cur / 2); it.next_review = addDays(it.interval); }
  else if (kind === 'normal'){ const n = cur === 0 ? 1 : cur * 2; it.interval = n; it.next_review = addDays(n); }
  else { const n = cur === 0 ? 3 : cur * 4; it.interval = n; it.next_review = addDays(n); }
  save(); markDirty(current.deck); nextCard();
}
$('card').addEventListener('click', toggle);
$('btnHard').addEventListener('click', () => grade('hard'));
$('btnNormal').addEventListener('click', () => grade('normal'));
$('btnEasy').addEventListener('click', () => grade('easy'));
$('timerChk').addEventListener('change', e => { if (e.target.checked && current) startTimer(); else stopTimer(); });
if (listenMode) $('listenChk').checked = true;
$('listenChk').addEventListener('change', e => { listenMode = e.target.checked; try { localStorage.setItem('vocabListen', listenMode ? '1' : '0'); } catch(err){} if (current){ shown = true; toggle(); if (listenMode) autoSpeakListening(); } });
$('themeSel').addEventListener('change', e => { document.body.className = e.target.value; try{ localStorage.setItem('vocabTheme', e.target.value); }catch(err){} });
try { const th = localStorage.getItem('vocabTheme'); if (th !== null){ document.body.className = th; $('themeSel').value = th; } } catch(e){}

document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  leechMode = false;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); mode = b.dataset.mode;
  if (mode === 'list'){ $('studyView').classList.remove('on'); $('listView').classList.add('on'); renderList(); }
  else { $('listView').classList.remove('on'); $('studyView').classList.add('on'); current = null; nextCard(); }
}));

function renderRetention(){
  const items = data[listDeck];
  const buckets = [ ['今日・これから', 0, 0], ['1〜3日', 1, 3], ['4〜7日', 4, 7], ['8〜30日', 8, 30], ['31日〜（定着）', 31, 1e9] ];
  const counts = buckets.map(([ , lo, hi]) => items.filter(it => { const v = it.interval || 0; return v >= lo && v <= hi; }).length);
  const max = Math.max(1, ...counts);
  $('retention').innerHTML = '<div class="rt">📊 定着度（' + (listDeck === 'en' ? '英語' : '中国語') + '・復習間隔の分布）</div>' + buckets.map((b, i) =>
    '<div class="rr"><div class="rl">' + b[0] + '</div><div class="rb"><div class="rf" style="width:' + Math.round(counts[i] * 100 / max) + '%"></div></div><div class="rc">' + counts[i] + '語</div></div>').join('');
}
function renderList(){
  renderRetention();
  const q = $('search').value.trim().toLowerCase();
  const items = data[listDeck];
  let leechN = 0; ['en','cn'].forEach(dk => data[dk].forEach(it => { if ((it.lapses || 0) >= LEECH_MIN) leechN++; }));
  $('leechStudy').textContent = '⚠ 苦手だけ学習（' + leechN + '）';
  $('leechFilter').textContent = leechFilterOn ? '⚠ 苦手だけ表示中（解除）' : '⚠ 苦手だけ表示';
  $('addTitle').textContent = '＋ 単語を追加（' + (listDeck === 'en' ? '英語' : '中国語') + '）';
  $('fReading').style.display = listDeck === 'cn' ? '' : 'none';
  $('fExReading').style.display = listDeck === 'cn' ? '' : 'none';
  const frag = document.createDocumentFragment();
  let shown = 0;
  items.forEach((it, idx) => {
    const hay = (it.word + ' ' + (it.reading||'') + ' ' + it.meaning + ' ' + (it.example||'') + ' ' + (it.example_reading||'')).toLowerCase();
    if (q && !hay.includes(q)) return;
    if (leechFilterOn && (it.lapses || 0) < LEECH_MIN) return;
    shown++;
    const div = document.createElement('div'); div.className = 'item';
    const sub = [it.reading, it.meaning].filter(Boolean).join('　');
    div.innerHTML = '<b></b><div class="sub"></div><div class="meta"></div>';
    div.querySelector('b').textContent = it.word;
    div.querySelector('.sub').textContent = sub + (it.example ? '\nEx) ' + it.example : '');
    const badges = [];
    if (makeCloze(it, listDeck)) badges.push('🕳穴埋め可');
    if ((it.lapses || 0) >= LEECH_MIN) badges.push('⚠苦手');
    if ((it.lapses || 0) > 0) badges.push('難しい×' + it.lapses);
    div.querySelector('.meta').textContent = (badges.length ? badges.join(' ') + ' ／ ' : '') + '間隔 ' + (it.interval || 0) + '日 ／ 次回 ' + (it.next_review || '');
    div.addEventListener('click', () => editItem(idx));
    let pressTimer = null;
    div.addEventListener('touchstart', () => { pressTimer = setTimeout(() => { if (confirm('「' + it.word + '」を削除しますか？')){ items.splice(idx,1); save(); markDirty(listDeck); renderList(); } }, 700); }, {passive:true});
    div.addEventListener('touchend', () => clearTimeout(pressTimer));
    frag.appendChild(div);
  });

let ttsAudio = null;
function playTTSUrl(url){
  return new Promise((resolve, reject) => {
    try {
      if (ttsAudio){ try { ttsAudio.pause(); } catch(e){} }
      const a = new Audio(url);
      ttsAudio = a;
      let done = false;
      const ok = () => { if (!done){ done = true; resolve(); } };
      const ng = () => { if (!done){ done = true; reject(new Error('tts')); } };
      a.addEventListener('playing', ok);
      a.addEventListener('error', ng);
      const pr = a.play();
      if (pr && pr.then) pr.then(ok).catch(ng);
      setTimeout(() => { if (!done && a.readyState === 0 && a.paused) ng(); }, 7000);
    } catch(e){ reject(e); }
  });
}
// 高音質ニューラル音声 (Edge読み上げ / Xiaoxiao等)
const EDGE_TOKEN = '6A5AA1D4EAFF4E9FB37E23D68491D6F4';
async function secMsGec(){
  const ticks = Math.floor((Date.now() / 1000 + 11644473600) * 1e7 / 3e9) * 3e9;
  const str = String(ticks) + EDGE_TOKEN;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
}
function escXml(t){ return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
async function edgeSpeakBlob(text, deck){
  const voice = deck === 'cn' ? 'zh-CN-XiaoxiaoNeural' : 'en-US-AriaNeural';
  const lang = deck === 'cn' ? 'zh-CN' : 'en-US';
  const gec = await secMsGec();
  const url = 'wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1?TrustedClientToken=' + EDGE_TOKEN + '&Sec-MS-GEC=' + gec + '&Sec-MS-GEC-Version=1-130.0.2849.68';
  return new Promise((resolve, reject) => {
    let ws, chunks = [], done = false;
    const fail = e => { if (!done){ done = true; try { ws && ws.close(); } catch(_){} reject(e || new Error('edge')); } };
    const timer = setTimeout(() => fail(new Error('timeout')), 4000);
    try { ws = new WebSocket(url); } catch(e){ clearTimeout(timer); return fail(e); }
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => {
      const ts = new Date().toISOString();
      ws.send('X-Timestamp:' + ts + '\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n' + JSON.stringify({ context: { synthesis: { audio: { metadataoptions: { sentenceBoundaryEnabled: 'false', wordBoundaryEnabled: 'false' }, outputFormat: 'audio-24khz-48kbitrate-mono-mp3' } } } }));
      const reqId = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
      const ssml = '<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="' + lang + '"><voice name="' + voice + '"><prosody pitch="+0Hz" rate="+0%" volume="+100%">' + escXml(text) + '</prosody></voice></speak>';
      ws.send('X-RequestId:' + reqId + '\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:' + ts + 'Z\r\nPath:ssml\r\n\r\n' + ssml);
    };
    ws.onmessage = ev => {
      if (typeof ev.data === 'string'){
        if (ev.data.includes('Path:turn.end')){
          clearTimeout(timer);
          if (!done){ done = true; try { ws.close(); } catch(_){}
            const blob = new Blob(chunks, { type: 'audio/mpeg' });
            blob.size > 800 ? resolve(blob) : reject(new Error('empty'));
          }
        }
      } else {
        const dv = new DataView(ev.data);
        if (ev.data.byteLength < 2) return;
        const hlen = dv.getUint16(0);
        const header = new TextDecoder().decode(ev.data.slice(2, 2 + hlen));
        if (header.includes('Path:audio')) chunks.push(ev.data.slice(2 + hlen));
      }
    };
    ws.onerror = () => { clearTimeout(timer); fail(new Error('ws')); };
    ws.onclose = () => { if (!done && chunks.length){ clearTimeout(timer); done = true; const blob = new Blob(chunks, { type: 'audio/mpeg' }); blob.size > 800 ? resolve(blob) : fail(new Error('closed')); } };
  });
}

function speakLocal(text, deck){
  return new Promise(resolve => {
    const synth = speechSynthesis;
    const doSpeak = () => {
      try {
        const u = new SpeechSynthesisUtterance(text);
        const vs = (synth.getVoices() || []).filter(v => (v.lang || '').toLowerCase().startsWith(deck === 'cn' ? 'zh' : 'en'));
        const vscore = v => { const s = ((v.name || '') + ' ' + (v.voiceURI || '')).toLowerCase(); return (s.includes('premium') || s.includes('enhanced')) ? 3 : (s.includes('siri') ? 2 : 0); };
        const v = vs.sort((a, b) => vscore(b) - vscore(a))[0];
        if (v){ u.voice = v; u.lang = v.lang; } else { u.lang = deck === 'cn' ? 'zh-CN' : 'en-US'; }
        u.rate = deck === 'cn' ? 0.78 : 0.92;
        let started = false, settled = false;
        u.onstart = () => { started = true; };
        u.onend = () => { settled = true; resolve(true); };
        u.onerror = () => { if (!settled){ settled = true; resolve(false); } };
        synth.speak(u);
        setTimeout(() => { if (!settled){ settled = true; if (!started){ try { synth.cancel(); } catch(e){} resolve(false); } else resolve(true); } }, 900);
      } catch(e){ resolve(false); }
    };
    try {
      if (synth.speaking || synth.pending){ synth.cancel(); setTimeout(doSpeak, 90); }
      else doSpeak();
      if (synth.paused) synth.resume();
    } catch(e){ resolve(false); }
  });
}

const LEECH_MIN = 3;
let leechMode = false, leechFilterOn = false, currentCloze = null;
const CLOZE_STRIP = /^[\s（）()、，,。．？！?!…·—「」『』“”"'：:；;・]+|[\s（）()、，,。．？！?!…·—「」『』“”"'：:；;・]+$/g;
function clozeParts(word){
  const segs = String(word || '').split('~');
  const parts = [];
  for (const seg of segs){
    const opt = /^\s*[（(]/.test(seg) && /[）)]\s*$/.test(seg);
    const core = seg.replace(CLOZE_STRIP, '');
    if (core) parts.push({ text: core, optional: opt });
  }
  return parts;
}
function blankFor(text, deck){ const n = [...String(text)].length; return deck === 'en' ? '_'.repeat(n) : '＿'.repeat(n); }
function makeCloze(item, deck){
  const ex = item.example || '';
  if (!ex) return null;
  const word = String(item.word || '');
  const parts = clozeParts(word);
  if (!parts.length) return null;
  const hay = deck === 'en' ? ex.toLowerCase() : ex;
  const needle = t => deck === 'en' ? t.toLowerCase() : t;
  if (!word.includes('~') && parts.length === 1){
    const p = needle(parts[0].text);
    if (!hay.includes(p)) return null;
    let out = '', idx = 0, hit = 0;
    while (true){ const i = hay.indexOf(p, idx); if (i < 0) break; out += ex.slice(idx, i) + blankFor(parts[0].text, deck); idx = i + p.length; hit++; }
    return hit ? out + ex.slice(idx) : null;
  }
  let out = '', last = 0, pos = 0, hit = 0;
  for (const part of parts){
    const p = needle(part.text);
    const i = hay.indexOf(p, pos);
    if (i < 0){ if (part.optional) continue; return null; }
    out += ex.slice(last, i) + blankFor(part.text, deck);
    last = i + p.length; pos = last; hit++;
  }
  return hit ? out + ex.slice(last) : null;
}

// ===== GitHub sync (base-snapshot方式) =====
// ルール: 起動時 = GitHubと「前回同期した状態(base)」を比べて3方向判定。
//   GitHubが新しい & 自分が未変更 → GitHubを取り込む（削除も反映）
//   自分が未変更でない & GitHubが同じ → 自分の変更を送る
//   両方変化（同時利用）→ 単語単位マージ（進捗優先）して送る
// 利用中 = 変更のたびにプッシュのみ。
const GH_FILES = { en: 'english_vocab.json', cn: 'chinese_vocab.json' };
let ghCfg = null;
try { ghCfg = JSON.parse(localStorage.getItem('vocabGhCfg') || 'null'); } catch(e){}
function ghStatus(msg){ const el = $('ghStatus'); if (el) el.textContent = msg; }
function ghReady(){ return !!(ghCfg && ghCfg.owner && ghCfg.repo && ghCfg.token); }
function b64enc(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64dec(b64){ return decodeURIComponent(escape(atob(b64.replace(/\s/g, '')))); }

let ghBase = {}; try { ghBase = JSON.parse(localStorage.getItem('vocabGhBaseV3') || '{}'); } catch(e){}
function saveBase(){ try { localStorage.setItem('vocabGhBaseV3', JSON.stringify(ghBase)); } catch(e){} }
const SYNC_FIELDS = ['word','meaning','example','interval','next_review','reading','example_reading','lapses'];
function canon(items){
  const norm = (items || []).map(it => { const o = {}; SYNC_FIELDS.forEach(f => { o[f] = (it[f] === undefined ? (f === 'interval' ? 0 : '') : it[f]); }); return o; });
  norm.sort((a, b) => { const x = String(a.word).toLowerCase(), y = String(b.word).toLowerCase(); return x < y ? -1 : (x > y ? 1 : 0); });
  return JSON.stringify(norm);
}
function sameItems(a, b){ return canon(a) === canon(b); }
function pendingDeck(deck){ const b = ghBase[deck]; if (!b) return (data[deck] || []).length > 0; return !sameItems(data[deck], b.items); }
function anyPending(){ return ['en','cn'].some(pendingDeck); }

let syncBusy = false, syncErr = '', lastPull = 0;
function syncUi(){
  const p = $('syncPill'); if (!p) return;
  if (!ghReady()) p.textContent = '☁ 未設定';
  else if (syncBusy) p.textContent = '⏳ 同期中…';
  else if (syncErr) p.textContent = '⚠ 失敗（タップで再試行）';
  else if (anyPending()) p.textContent = '📤 未送信あり（タップで同期）';
  else p.textContent = '☁ 同期済み';
}

async function ghApi(method, file, payload){
  const url = 'https://api.github.com/repos/' + ghCfg.owner + '/' + ghCfg.repo + '/contents/' + file + (method === 'GET' ? ('?ref=' + (ghCfg.branch || 'main') + '&_=' + Date.now()) : '');
  const opt = { method: method, headers: { 'Authorization': 'Bearer ' + ghCfg.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } };
  if (method === 'GET') opt.cache = 'no-store';
  if (payload){ opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(payload); }
  const res = await fetch(url, opt);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('GitHub API ' + res.status);
  return res.json();
}
async function ghGet(file){
  const j = await ghApi('GET', file);
  if (!j) return null;
  return { items: JSON.parse(b64dec(j.content)), sha: j.sha };
}
async function ghPut(file, items, sha){
  const payload = { message: 'sync ' + file, content: b64enc(JSON.stringify(items, null, 2)), branch: ghCfg.branch || 'main' };
  if (sha) payload.sha = sha;
  const j = await ghApi('PUT', file, payload);
  return j && j.content ? j.content.sha : null;
}

function mergeVocab(localItems, remoteItems){
  const key = it => String(it.word || '').toLowerCase();
  const score = it => [it.interval || 0, String(it.next_review || '')];
  const rmap = {}; remoteItems.forEach(it => rmap[key(it)] = it);
  const seen = {}; const out = [];
  localItems.forEach(it => { const k = key(it); seen[k] = 1; const r = rmap[k];
    if (r && (score(r)[0] > score(it)[0] || (score(r)[0] === score(it)[0] && score(r)[1] >= score(it)[1]))) out.push(r); else out.push(it); });
  remoteItems.forEach(it => { if (!seen[key(it)]) out.push(it); });
  return out;
}

let pushTimers = {};
function markDirty(deck){
  syncUi();
  if (!ghReady()) return;
  clearTimeout(pushTimers[deck]);
  pushTimers[deck] = setTimeout(() => pushDeck(deck), 1200);
}

async function pushDeck(deck, shaOverride){
  if (!ghReady()) return;
  const file = GH_FILES[deck];
  const base = ghBase[deck];
  const sha = shaOverride !== undefined ? shaOverride : (base ? base.sha : undefined);
  syncBusy = true; syncUi();
  try {
    const newSha = await ghPut(file, data[deck], sha);
    ghBase[deck] = { sha: newSha, items: JSON.parse(JSON.stringify(data[deck])) };
    saveBase(); syncErr = '';
    ghStatus('☁ 同期済み ' + new Date().toLocaleTimeString());
  } catch(e) {
    if (String(e.message).includes('409') || String(e.message).includes('422')) {
      try {
        const remote = await ghGet(file);
        const merged = remote ? mergeVocab(data[deck], remote.items) : data[deck];
        const newSha = await ghPut(file, merged, remote ? remote.sha : undefined);
        data[deck] = merged; save();
        ghBase[deck] = { sha: newSha, items: JSON.parse(JSON.stringify(merged)) };
        saveBase(); syncErr = '';
        ghStatus('☁ 競合をマージして同期しました');
        if (mode === 'list') renderList();
      } catch(e2){ syncErr = e2.message; ghStatus('⚠ 同期に失敗（' + e2.message + '）'); }
    } else { syncErr = e.message; ghStatus('⚠ 同期に失敗（' + e.message + '）次回開いたときに再同期します'); }
  }
  syncBusy = false; syncUi();
}

async function syncDeck(deck){
  const file = GH_FILES[deck];
  const base = ghBase[deck];
  const remote = await ghGet(file);
  if (!remote){
    if ((data[deck] || []).length) await pushDeck(deck);
    else { ghBase[deck] = { sha: null, items: [] }; saveBase(); }
    return;
  }
  if (!(data[deck] || []).length && remote.items.length){
    // 手元が空でGitHubに単語がある場合は、状態が壊れているとみなしてGitHubを正とする（空のまま送信しない）
    data[deck] = remote.items; save();
    ghBase[deck] = { sha: remote.sha, items: JSON.parse(JSON.stringify(remote.items)) };
    saveBase(); return;
  }
  if (!base){
    // 初回(v3): GitHubの名簿を正とし、手元だけにある単語は取り込まない（旧方式の残骸を掃除）。
    // 共有単語は進捗が進んでいる方を残す。
    const key = it => String(it.word || '').toLowerCase();
    const score = it => [it.interval || 0, String(it.next_review || '')];
    const lmap = {}; (data[deck] || []).forEach(it => lmap[key(it)] = it);
    const merged0 = remote.items.map(r => { const l = lmap[key(r)]; return (l && (score(l)[0] > score(r)[0] || (score(l)[0] === score(r)[0] && score(l)[1] > score(r)[1]))) ? l : r; });
    if (sameItems(merged0, remote.items)){
      data[deck] = remote.items; save();
      ghBase[deck] = { sha: remote.sha, items: JSON.parse(JSON.stringify(remote.items)) };
      saveBase(); return;
    }
    data[deck] = merged0; save();
    await pushDeck(deck, remote.sha);
    return;
  }
  const localChanged = !sameItems(data[deck], base.items);
  const remoteChanged = base.sha !== remote.sha;
  if (!remoteChanged && !localChanged) return;
  if (!remoteChanged && localChanged){ await pushDeck(deck); return; }
  if (remoteChanged && !localChanged){
    data[deck] = remote.items; save();
    ghBase[deck] = { sha: remote.sha, items: JSON.parse(JSON.stringify(remote.items)) };
    saveBase(); return;
  }
  const merged = mergeVocab(data[deck], remote.items);
  data[deck] = merged; save();
  await pushDeck(deck, remote.sha);
}

async function syncPullAll(){
  if (!ghReady()){ ghStatus('未設定：ローカル保存のみで動作中'); syncUi(); return; }
  syncBusy = true; syncUi(); lastPull = Date.now();
  ghStatus('☁ 同期中…');
  let err = '';
  for (const deck of ['en','cn']){ try { await syncDeck(deck); } catch(e){ err = e.message; } }
  syncBusy = false;
  if (err){ syncErr = err; ghStatus('⚠ 同期失敗（' + err + '）'); }
  else { syncErr = ''; ghStatus(anyPending() ? '📤 未送信の変更があります（タップで同期）' : '☁ 同期完了 ' + new Date().toLocaleTimeString()); }
  syncUi();
}

async function forcePullAll(){
  if (!ghReady()) return;
  for (const deck of ['en','cn']){
    try { const remote = await ghGet(GH_FILES[deck]); if (remote){ data[deck] = remote.items; ghBase[deck] = { sha: remote.sha, items: JSON.parse(JSON.stringify(remote.items)) }; } } catch(e){}
  }
  save(); saveBase(); syncUi();
}

function fillGhForm(){
  if (!ghCfg) return;
  $('ghOwner').value = ghCfg.owner || ''; $('ghRepo').value = ghCfg.repo || '';
  $('ghToken').value = ghCfg.token || ''; $('ghBranch').value = ghCfg.branch || '';
}
$('ghSave').addEventListener('click', async () => {
  ghCfg = { owner: $('ghOwner').value.trim(), repo: $('ghRepo').value.trim(), token: $('ghToken').value.trim(), branch: $('ghBranch').value.trim() || 'main' };
  try { localStorage.setItem('vocabGhCfg', JSON.stringify(ghCfg)); } catch(e){}
  if (ghReady()){ await syncPullAll(); if (mode === 'list') renderList(); current = null; nextCard(); }
  else ghStatus('入力が不足しています');
  syncUi();
});
$('ghSyncNow').addEventListener('click', async () => { await syncPullAll(); if (mode === 'list') renderList(); else { current = null; nextCard(); } });
fillGhForm();
syncUi();

$('syncPill').addEventListener('click', async () => {
  if (!ghReady()){ document.querySelector('[data-mode="list"]').click(); setTimeout(() => $('ghForm').scrollIntoView({behavior:'smooth'}), 80); return; }
  await syncPullAll();
  if (mode === 'list') renderList(); else { current = null; nextCard(); }
});
let lastAutoReading = '', lastAutoExReading = '';
function openAddModal(){
  if (mode === 'en' || mode === 'cn') listDeck = mode;
  lastAutoReading = ''; lastAutoExReading = '';
  $('fReading').style.display = listDeck === 'cn' ? '' : 'none';
  $('fExReading').style.display = listDeck === 'cn' ? '' : 'none';
  $('addTitle').textContent = '＋ 単語を追加（' + (listDeck === 'en' ? '英語' : '中国語') + '）';
  $('addModal').classList.add('on');
  setTimeout(() => { try { $('fWord').focus({preventScroll:true}); } catch(e){} }, 60);
}
function closeAddModal(){ $('addModal').classList.remove('on'); }
$('fabAdd').addEventListener('click', openAddModal);
$('addClose').addEventListener('click', closeAddModal);
$('addModal').addEventListener('click', e => { if (e.target === $('addModal')) closeAddModal(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && ghReady() && Date.now() - lastPull > 60000) syncPullAll(); });
window.addEventListener('online', () => { if (ghReady()) syncPullAll(); });

(async () => { await syncPullAll(); nextCard(); syncUi(); })();

</script>
