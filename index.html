<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>単語帳（英語・中国語）</title>
<style>
:root{
  --bg:#1e1e1e; --card:#2d2d2d; --border:#404040; --text:#e0e0e0; --muted:#a0a0a0;
  --accent:#4ec9b0; --success:#b5cea8; --warning:#f14c4c; --normal:#569cd6; --input:#3c3c3c;
}
body.rpg{--bg:#0f0f1a;--card:#1a1a2e;--border:#3b3b6d;--text:#f0f0f5;--muted:#9494b8;--accent:#ffd700;--success:#00ffcc;--warning:#ff4757;--normal:#3498db;--input:#242438}
body.souls{--bg:#12100e;--card:#1c1917;--border:#4a413b;--text:#e6dbc9;--muted:#8c8275;--accent:#e65100;--success:#48c9b0;--warning:#a93226;--normal:#d35400;--input:#282420}
body.persona{--bg:#0c0c0c;--card:#191919;--border:#3d3d3d;--text:#f5f5f5;--muted:#9c9c9c;--accent:#e60012;--success:#2fd673;--warning:#ff7a1a;--normal:#57a7ff;--input:#242424}
body.zelda{--bg:#0d1b1e;--card:#173034;--border:#2f4f52;--text:#e9f2e7;--muted:#96ada0;--accent:#5ec8e5;--success:#8bc34a;--warning:#ef5350;--normal:#d9b45b;--input:#1f3d40}
body.genshin{--bg:#f2ecdc;--card:#fbf8ef;--border:#d9cfb4;--text:#3c4048;--muted:#8d8672;--accent:#a87f2d;--success:#4e9a68;--warning:#cf5246;--normal:#5b7fa6;--input:#fffdf4}
body.nier{--bg:#d3cfba;--card:#e2ddc9;--border:#a8a38d;--text:#454138;--muted:#7c7767;--accent:#8c4a32;--success:#5f7052;--warning:#b03a2e;--normal:#5d6d7e;--input:#eae6d2}
body.doubutsu{--bg:#f6f1de;--card:#fffdf0;--border:#cfdfb4;--text:#59523d;--muted:#9c9377;--accent:#4f9e5f;--success:#35a06b;--warning:#e0684b;--normal:#4a90c2;--input:#fdfaf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{padding:10px 14px 4px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-size:17px;margin:0}
select,input,textarea{background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px;font-size:15px}
.tabs{display:flex;gap:6px;padding:8px 14px 0}
.tabs button{flex:1;padding:11px 4px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:15px;font-weight:700}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
main{flex:1;display:flex;flex-direction:column;padding:12px 14px;gap:10px;max-width:720px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 20px;text-align:center;cursor:pointer;user-select:none;position:relative;touch-action:manipulation}
.badge{position:absolute;top:12px;left:16px;font-size:12px;font-weight:700;color:var(--accent)}
.timer{position:absolute;top:12px;right:54px;font-size:14px;font-weight:700;color:var(--warning)}
.card-edit{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--muted);line-height:0;padding:6px;cursor:pointer;z-index:2}
.word{font-size:34px;font-weight:800;line-height:1.3;word-break:break-word}
.reading{font-size:19px;color:var(--accent);margin-top:12px;white-space:pre-line}
.meaning{font-size:21px;color:var(--accent);margin-top:8px;white-space:pre-line;line-height:1.5}
.example{font-size:16px;color:var(--muted);margin-top:16px;white-space:pre-line;line-height:1.6}
.hint{font-size:14px;color:var(--muted)}
.grades{display:flex;gap:8px}
.grades button{flex:1;padding:16px 4px;border-radius:12px;border:1px solid var(--border);background:var(--card);font-size:16px;font-weight:800}
.g-hard{color:var(--warning)} .g-normal{color:var(--normal)} .g-easy{color:var(--success)}
.grades button:disabled{opacity:.35}
.stats{font-size:13px;color:var(--accent);font-weight:700;padding:0 2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-weight:700}
label.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--accent);font-weight:700}
.view{display:none;flex-direction:column;gap:10px}
.view.on{display:flex}
.list{display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.item b{font-size:16px}
.item .sub{color:var(--muted);font-size:13px;margin-top:2px;line-height:1.5}
.item .meta{color:var(--accent);font-size:12px;margin-top:2px}
form.add{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
form.add button{background:var(--input);color:var(--accent);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:15px;font-weight:800}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.danger{color:var(--warning)!important}
.ret{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.ret .rt{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.ret .rr{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}
.ret .rl{width:86px;color:var(--muted);flex:none}
.ret .rb{flex:1;background:var(--input);border-radius:6px;height:10px;overflow:hidden}
.ret .rf{height:100%;background:var(--accent)}
.ret .rc{width:44px;text-align:right;color:var(--accent);font-weight:700;flex:none}
.pill{border:1px solid var(--border);background:var(--card);color:var(--accent);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;z-index:90;padding:20px 12px}
.modal.on{display:flex}
.modal-card{position:relative;width:100%;max-width:520px;max-height:88vh;overflow-y:auto}
.modal-card form.add{box-shadow:0 8px 30px rgba(0,0,0,.5)}
.modal-x{position:absolute;top:4px;right:10px;background:none;border:none;color:var(--muted);font-size:26px;line-height:1;cursor:pointer;z-index:2;padding:6px}
.speak-row{display:flex;gap:8px}
.split-row{display:flex;gap:6px;align-items:center}
.split-row input{flex:1;min-width:0}
.tilde-sep{color:var(--muted);font-weight:700;padding:0 2px}
.speak-row button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--accent);font-size:14px;font-weight:700;cursor:pointer}
#studyView{perspective:900px}
button{transition:transform .08s ease,background-color .2s ease,border-color .2s ease,color .2s ease;touch-action:manipulation}
button:active{transform:scale(.965)}
.grades button:active{transform:scale(.93)}
.fab:active{transform:scale(.9)}
body,.card,.item,form.add,.ret,.pill{transition:background-color .35s ease,border-color .35s ease,color .35s ease}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.anim-in{animation:cardIn .28s cubic-bezier(.2,.9,.25,1.15)}
@keyframes flipIn{from{transform:rotateY(-32deg);opacity:.35}to{transform:rotateY(0);opacity:1}}
.anim-flip{animation:flipIn .26s ease-out}
@keyframes flipBack{from{transform:rotateY(32deg);opacity:.35}to{transform:rotateY(0);opacity:1}}
.anim-flip-b{animation:flipBack .26s ease-out}
@keyframes outL{to{opacity:0;transform:translateX(-30px) scale(.96)}}
@keyframes outR{to{opacity:0;transform:translateX(30px) scale(.96)}}
@keyframes outN{to{opacity:0;transform:scale(.94)}}
.anim-out-l{animation:outL .15s ease-in forwards}
.anim-out-r{animation:outR .15s ease-in forwards}
.anim-out-n{animation:outN .15s ease-in forwards}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal.on .modal-card{animation:modalIn .22s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.view.on{animation:fadeUp .25s ease-out}
.item{animation:fadeUp .3s ease-out backwards}
#warmFx{position:fixed;inset:0;background:#ff9329;mix-blend-mode:soft-light;opacity:0;pointer-events:none;z-index:200;transition:opacity 2.5s ease}
#rainCv{position:fixed;top:0;left:0;width:100%;height:210px;z-index:5;pointer-events:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;font-size:30px;line-height:1;background:var(--accent);color:#141414;border:none;box-shadow:0 4px 14px rgba(0,0,0,.45);z-index:50;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg> 単語帳</h1>
  <button id="syncPill" class="pill"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg> 未設定</button>
  <div class="row" style="align-items:center">
    <label class="chk"><input type="checkbox" id="timerChk" style="width:20px;height:20px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>30秒</label>
    <label class="chk"><input type="checkbox" id="listenChk" style="width:20px;height:20px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg> 聴き取り</label>
    <label class="chk"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><line x1="16" y1="13" x2="16" y2="21"/><line x1="8" y1="13" x2="8" y2="21"/><line x1="12" y1="15" x2="12" y2="23"/><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg> <select id="ambSel" style="font-size:14px;padding:2px 4px;border-radius:6px"><option value="rain">雨</option><option value="fire">焚き火</option><option value="waves">波</option><option value="river">川</option><option value="insects">夜の虫</option><option value="auto">おまかせ</option><option value="off">なし</option></select></label>
    <select id="themeSel">
      <option value="">ダーク</option>
      <option value="rpg">レトロ</option>
      <option value="souls">ソウル</option>
      <option value="persona">レッド</option>
      <option value="zelda">ティール</option>
      <option value="genshin">アイボリー</option>
      <option value="nier">セピア</option>
      <option value="doubutsu">パステル</option>
    </select>
  </div>
</header>

<div class="tabs">
  <button data-mode="en" class="on">英語</button>
  <button data-mode="cn">中国語</button>
  <button data-mode="mix">混合</button>
  <button data-mode="list"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> 一覧</button>
</div>

<main>
  <section id="studyView" class="view on">
    <div class="card" id="card">
      <div class="badge" id="badge"></div>
      <div class="timer" id="timer"></div>
      <button id="cardEdit" class="card-edit" aria-label="この単語を編集" style="display:none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>
      <div class="word" id="word">---</div>
      <div class="reading" id="reading"></div>
      <div class="meaning" id="meaning"></div>
      <div class="example" id="example"></div>
      <div class="hint" id="hint">タップで意味を表示</div>
    </div>
    <div class="speak-row">
      <button id="speakWord" style="display:none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg> 単語</button>
      <button id="speakEx" style="display:none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg> 例文</button>
    </div>
    <div class="grades">
      <button class="g-hard" id="btnHard">難しい</button>
      <button class="g-normal" id="btnNormal">普通</button>
      <button class="g-easy" id="btnEasy">簡単</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="note" id="studyTime" style="text-align:center;margin-top:2px"></div>
  </section>

  <section id="listView" class="view">
    <input id="search" type="search" placeholder="🔍 検索（単語・意味・例文）">
    <div class="ret" id="retention"></div>
    <div class="row">
      <button id="deckEn">英語の単語</button>
      <button id="deckCn">中国語の単語</button>
      <button id="leechFilter"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> 苦手だけ表示</button>
      <button id="leechStudy"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> 苦手だけ学習</button>
    </div>
    <div class="list" id="list"></div>
    <div class="row">
      <button id="expCsv">📤 CSV出力</button>
      <button id="expJson">📤 JSON出力（全データ）</button>
      <button id="impJsonBtn">📥 JSON取込</button>
      <input type="file" id="impJson" accept=".json,application/json" style="display:none">
      <button id="resetBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg> GitHubから再取得</button>
    </div>

    <form class="add" id="ghForm">
      <b><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg> GitHub同期</b> <span class="note">同期方式 v3.1 ／ 機能 v13（環境音セレクタ・時間帯オート・夜の暖色）</span>
      <input id="ghOwner" placeholder="GitHubユーザー名（owner）">
      <input id="ghRepo" placeholder="リポジトリ名（Private）">
      <input id="ghToken" type="password" placeholder="トークン（Contents: Read and write）">
      <input id="ghBranch" placeholder="ブランチ（空欄なら main）">
      <div class="row">
        <button type="button" id="ghSave">設定を保存</button>
        <button type="button" id="ghSyncNow">今すぐ同期</button>
      </div>
      <div class="note" id="ghStatus">未設定：ローカル保存のみで動作中</div>
    </form>
  </section>
</main>
<div id="addModal" class="modal">
  <div class="modal-card">
    <button id="addClose" class="modal-x" aria-label="閉じる">×</button>
    <form class="add" id="addForm">
      <b id="addTitle">＋ 単語を追加</b>
      <div class="split-row">
        <input id="fWordL" placeholder="単語" required>
        <span class="tilde-sep">~</span>
        <input id="fWordR" placeholder="後半（フレーズ用）">
      </div>
      <div class="split-row" id="fReadingRow">
        <input id="fReadingL" placeholder="ピンイン（中国語のみ）">
        <span class="tilde-sep">~</span>
        <input id="fReadingR" placeholder="後半ピンイン">
      </div>
      <input id="fMeaning" placeholder="意味" required>
      <input id="fExample" placeholder="例文">
      <input id="fExReading" placeholder="例文ピンイン（中国語のみ）">
      <button type="submit">追加する</button>
    </form>
  </div>
</div>
<div id="editModal" class="modal">
  <div class="modal-card">
    <button id="editClose" class="modal-x" aria-label="閉じる">×</button>
    <form class="add" id="editForm">
      <b id="editTitle">単語を編集</b>
      <div class="split-row">
        <input id="eWordL" placeholder="単語" required>
        <span class="tilde-sep">~</span>
        <input id="eWordR" placeholder="後半（フレーズ用）">
      </div>
      <div class="split-row" id="eReadingRow">
        <input id="eReadingL" placeholder="ピンイン（中国語のみ）">
        <span class="tilde-sep">~</span>
        <input id="eReadingR" placeholder="後半ピンイン">
      </div>
      <input id="eMeaning" placeholder="意味" required>
      <input id="eExample" placeholder="例文">
      <input id="eExReading" placeholder="例文ピンイン（中国語のみ）">
      <button type="submit">保存する</button>
      <button type="button" id="eDelete" class="danger"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg> この単語を削除</button>

{ const keys = Object.keys(studyMap).sort(); if (keys.length > 400) { keys.slice(0, keys.length - 400).forEach(k => delete studyMap[k]); } }

function grade(kind, isAuto){

const THEME_CYCLE = ['', 'rpg', 'souls', 'persona', 'zelda', 'genshin', 'nier', 'doubutsu'];
function applyTheme(v){ document.body.className = v; $('themeSel').value = v; try { localStorage.setItem('vocabTheme', v); } catch(err){} }

let reviewTotal = 0, themeAutoIdx = 0;
try { reviewTotal = parseInt(localStorage.getItem('vocabReviewTotal') || '0', 10) || 0; themeAutoIdx = parseInt(localStorage.getItem('vocabThemeAutoIdx') || '0', 10) || 0; } catch(e){}

try { const th = localStorage.getItem('vocabTheme'); if (th !== null){ document.body.className = th; $('themeSel').value = th; } } catch(e){}

// ===== 雨エフェクト（ガラスを滴る雨） =====
const rainCv = $('rainCv'), rctx = rainCv.getContext('2d');
const rainAudio = $('rainAudio');
let rainOn = true, rainRaf = null, rainW = 0, rainH = 210, drops = [], trails = [], mists = [];
rainOn = false;
if (rainAudio) rainAudio.volume = 0.32;
function sizeRain(){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  rainW = window.innerWidth; rainH = 210;
  rainCv.width = Math.floor(rainW * dpr); rainCv.height = Math.floor(rainH * dpr);
  rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  mists = [];
  for (let i = 0; i < 130; i++) mists.push({ x: Math.random() * rainW, y: Math.random() * rainH, r: 0.4 + Math.random() * 1.0, ph: Math.random() * 6.28, sp: 0.2 + Math.random() * 0.6 });
}
function drawRealDrop(x, y, r){
  const g = rctx.createRadialGradient(x, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, 'rgba(255,255,255,0.03)');
  g.addColorStop(0.72, 'rgba(205,228,246,0.06)');
  g.addColorStop(1, 'rgba(235,246,255,0.22)');
  rctx.fillStyle = g;
  rctx.beginPath(); rctx.arc(x, y, r, 0, 6.2832); rctx.fill();
  rctx.beginPath(); rctx.arc(x, y, r * 0.8, Math.PI * 0.3, Math.PI * 0.7);
  rctx.strokeStyle = 'rgba(255,255,255,0.35)'; rctx.lineWidth = Math.max(r * 0.16, 0.5); rctx.stroke();
  rctx.beginPath(); rctx.arc(x - r * 0.34, y - r * 0.38, Math.max(r * 0.15, 0.4), 0, 6.2832);
  rctx.fillStyle = 'rgba(255,255,255,0.5)'; rctx.fill();
}
function rainStep(){
  if (!rainOn){ rainRaf = null; return; }
  rctx.clearRect(0, 0, rainW, rainH);
  const t = performance.now() / 1000;
  mists.forEach(m => {
    const a = 0.05 + 0.045 * (0.5 + 0.5 * Math.sin(m.ph + t * m.sp));
    rctx.beginPath(); rctx.arc(m.x, m.y, m.r, 0, 6.2832);
    rctx.fillStyle = 'rgba(210,232,248,' + a.toFixed(3) + ')'; rctx.fill();
  });
  if (drops.length < 24 && Math.random() < 0.16)
    drops.push({ x: Math.random() * rainW, y: 6 + Math.random() * (rainH - 12), r: 0.6, max: 1.9 + Math.random() * 1.7, vy: 0, ph: Math.random() * 6.28, run: false });
  trails = trails.filter(tr => (tr.life -= 0.02) > 0);
  trails.forEach(tr => { rctx.globalAlpha = Math.max(tr.life, 0) * 0.55; drawRealDrop(tr.x, tr.y, tr.r); });
  rctx.globalAlpha = 1;
  drops = drops.filter(d => d.y < rainH + 8);
  drops.forEach(d => {
    if (!d.run){
      if (d.r < d.max) d.r += 0.006;
      else if (Math.random() < 0.004) d.run = true;
    } else {
      d.vy = Math.min(d.vy + 0.09, 2.6 + d.max * 0.5);
      d.y += d.vy;
      d.x += Math.sin(d.y * 0.06 + d.ph) * 0.3;
      d.r = Math.max(d.r - 0.008, 0.9);
      if (Math.random() < 0.45) trails.push({ x: d.x + (Math.random() - 0.5) * 1.5, y: d.y - d.r - 1, r: d.r * 0.38, life: 0.85 });
    }
    drawRealDrop(d.x, d.y, d.r);
  });
  rainRaf = requestAnimationFrame(rainStep);
}
function startRain(){ sizeRain(); rainCv.style.display = ''; if (rainRaf == null) rainRaf = requestAnimationFrame(rainStep); }
function stopRain(){ rainCv.style.display = 'none'; if (rainRaf != null){ cancelAnimationFrame(rainRaf); rainRaf = null; } }
// ===== 環境音（雨・焚き火・波・川・夜の虫／時間帯オート） =====
const RAIN_VOL = 0.32;
const AMB_FILES = { rain: 'rain_b64.txt', fire: 'fire_b64.txt', waves: 'waves_b64.txt', river: 'river_b64.txt', insects: 'insects_b64.txt' };
let ambSelVal = (() => { try { const v = localStorage.getItem('vocabAmbSel'); if (v) return v; return localStorage.getItem('vocabRain') === '0' ? 'off' : 'rain'; } catch(e){ return 'rain'; } })();
let ambKind = '', ambLoading = '', ambWantsPlay = false;
let rainAudio2 = null, rainCur = 0, rainCrossing = false, rainCrossTimer = null, rainWatchTimer = null;
function effAmb(){
  if (ambSelVal !== 'auto') return ambSelVal;
  const h = jstHour();
  if (h >= 5 && h < 9) return 'river';
  if (h >= 9 && h < 17) return 'waves';
  if (h >= 17 && h < 21) return 'fire';
  if (h >= 21 || h < 1) return 'insects';
  return 'rain';
}
function getRainDeck(){
  if (!rainAudio2){ rainAudio2 = new Audio(); rainAudio2.preload = 'auto'; }
  return [rainAudio, rainAudio2];
}
function fadeEl(el, target, durMs, done){
  if (el._ft){ clearInterval(el._ft); el._ft = null; }
  const from = el.volume, diff = target - from;
  if (Math.abs(diff) < 0.01){ el.volume = target; if (done) done(); return; }
  const steps = Math.max(Math.round(durMs / 50), 1), step = diff / steps;
  let n = 0;
  el._ft = setInterval(() => {
    n++;
    if (n >= steps){ clearInterval(el._ft); el._ft = null; el.volume = target; if (done) done(); return; }
    el.volume = Math.max(0, Math.min(1, from + step * n));
  }, 50);
}
function pauseAmbNow(){
  if (rainWatchTimer){ clearInterval(rainWatchTimer); rainWatchTimer = null; }
  if (rainCrossTimer){ clearInterval(rainCrossTimer); rainCrossTimer = null; rainCrossing = false; }
  if (!rainAudio) return;
  getRainDeck().forEach(el => { if (!el) return; if (el._ft){ clearInterval(el._ft); el._ft = null; } if (!el.paused) el.pause(); });
}
function stopAmbAudio(){
  if (!rainAudio) return;
  if (rainWatchTimer){ clearInterval(rainWatchTimer); rainWatchTimer = null; }
  if (rainCrossTimer){ clearInterval(rainCrossTimer); rainCrossTimer = null; rainCrossing = false; }
  getRainDeck().forEach(el => { if (el && !el.paused) fadeEl(el, 0, 900, () => { el.pause(); }); });
}
function ensureAmbSrc(kind){
  if (ambKind === kind || ambLoading === kind) return;
  ambLoading = kind;
  const use = t => {
    const bin = atob(t.replace(/\s/g, ''));
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    pauseAmbNow();
    const url = URL.createObjectURL(new Blob([arr], { type: 'audio/mpeg' }));
    const deck = getRainDeck();
    deck[0].src = url; deck[1].src = url;
    rainCur = 0;
    ambKind = kind; ambLoading = '';
    if (ambWantsPlay && effAmb() === kind) startAmbAudio();
  };
  let cached = null;
  try { cached = localStorage.getItem('vocabAmbB64_' + kind); if (!cached && kind === 'rain') cached = localStorage.getItem('vocabRainB64'); } catch(e){}
  if (cached && cached.length > 100000){ use(cached); return; }
  fetch(AMB_FILES[kind]).then(r => r.text()).then(t => {
    try { localStorage.setItem('vocabAmbB64_' + kind, t); } catch(e){}
    use(t);
  }).catch(() => { ambLoading = ''; });

function startRainWatch(){
  if (rainWatchTimer) return;
  rainWatchTimer = setInterval(() => {
    if (rainCrossing) return;
    const deck = getRainDeck(), el = deck[rainCur];
    if (!el || el.paused || !el.duration) return;
    if (el.currentTime > el.duration - 3.5) crossfadeRain();
  }, 400);
}
function crossfadeRain(){
  const deck = getRainDeck(), from = deck[rainCur], to = deck[1 - rainCur];
  if (!to) return;
  rainCrossing = true;
  try { to.currentTime = 0; } catch(e){}
  to.volume = 0;
  const p = to.play(); if (p && p.catch) p.catch(() => {});
  const t0 = Date.now(), D = 3000;
  rainCrossTimer = setInterval(() => {
    const pr = Math.min((Date.now() - t0) / D, 1);
    to.volume = RAIN_VOL * Math.sin(pr * Math.PI / 2);
    from.volume = RAIN_VOL * Math.cos(pr * Math.PI / 2);
    if (pr >= 1){
      clearInterval(rainCrossTimer); rainCrossTimer = null;
      from.pause();
      try { from.currentTime = 0; } catch(e){}
      rainCur = 1 - rainCur;
      rainCrossing = false;
    }
  }, 100);
}
function startAmbAudio(){

  if (ambKind !== eff){ ensureAmbSrc(eff); return; }
  const deck = getRainDeck(), cur = deck[rainCur], other = deck[1 - rainCur];
  if (rainCrossTimer){ clearInterval(rainCrossTimer); rainCrossTimer = null; rainCrossing = false; }
  if (other && !other.paused) fadeEl(other, 0, 600, () => { other.pause(); });
  if (cur.paused){
    cur.volume = 0;
    const p = cur.play(); if (p && p.catch) p.catch(() => {});
    fadeEl(cur, RAIN_VOL, 1200);
  } else fadeEl(cur, RAIN_VOL, 800);
  startRainWatch();
}

function playTTSUrl(url){

    try {
      const a = getTtsAudio();
      try { a.pause(); } catch(e){}
      let done = false;

// 高音質ニューラル音声 (Edge読み上げ / Xiaoxiao等)
const EDGE_TOKEN = '6A5AA1D4EAFF4E9FB37E23D68491D6F4';
async function secMsGec(){
  const ticks = Math.floor((Date.now() / 1000 + 11644473600) * 1e7 / 3e9) * 3e9;
  const str = String(ticks) + EDGE_TOKEN;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
}
function escXml(t){ return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
async function edgeSpeakBlob(text, deck){
  const voice = deck === 'cn' ? 'zh-CN-XiaoxiaoNeural' : 'en-US-AriaNeural';
  const lang = deck === 'cn' ? 'zh-CN' : 'en-US';
  const gec = await secMsGec();
  const url = 'wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1?TrustedClientToken=' + EDGE_TOKEN + '&Sec-MS-GEC=' + gec + '&Sec-MS-GEC-Version=1-130.0.2849.68';
  return new Promise((resolve, reject) => {
    let ws, chunks = [], done = false;
    const fail = e => { if (!done){ done = true; try { ws && ws.close(); } catch(_){} reject(e || new Error('edge')); } };
    const timer = setTimeout(() => fail(new Error('timeout')), 4000);
    try { ws = new WebSocket(url); } catch(e){ clearTimeout(timer); return fail(e); }
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => {
      const ts = new Date().toISOString();
      ws.send('X-Timestamp:' + ts + '\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n' + JSON.stringify({ context: { synthesis: { audio: { metadataoptions: { sentenceBoundaryEnabled: 'false', wordBoundaryEnabled: 'false' }, outputFormat: 'audio-24khz-48kbitrate-mono-mp3' } } } }));
      const reqId = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
      const ssml = '<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="' + lang + '"><voice name="' + voice + '"><prosody pitch="+0Hz" rate="+0%" volume="+100%">' + escXml(text) + '</prosody></voice></speak>';
      ws.send('X-RequestId:' + reqId + '\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:' + ts + 'Z\r\nPath:ssml\r\n\r\n' + ssml);
    };
    ws.onmessage = ev => {
      if (typeof ev.data === 'string'){
        if (ev.data.includes('Path:turn.end')){
          clearTimeout(timer);
          if (!done){ done = true; try { ws.close(); } catch(_){}
            const blob = new Blob(chunks, { type: 'audio/mpeg' });
            blob.size > 800 ? resolve(blob) : reject(new Error('empty'));
          }
        }
      } else {
        const dv = new DataView(ev.data);
        if (ev.data.byteLength < 2) return;
        const hlen = dv.getUint16(0);
        const header = new TextDecoder().decode(ev.data.slice(2, 2 + hlen));
        if (header.includes('Path:audio')) chunks.push(ev.data.slice(2 + hlen));
      }
    };
    ws.onerror = () => { clearTimeout(timer); fail(new Error('ws')); };
    ws.onclose = () => { if (!done && chunks.length){ clearTimeout(timer); done = true; const blob = new Blob(chunks, { type: 'audio/mpeg' }); blob.size > 800 ? resolve(blob) : fail(new Error('closed')); } };
  });
}

function speakLocal(text, deck){
  return new Promise(resolve => {
    const synth = speechSynthesis;
    const doSpeak = () => {
      try {
        const u = new SpeechSynthesisUtterance(text);
        const vs = (synth.getVoices() || []).filter(v => (v.lang || '').toLowerCase().startsWith(deck === 'cn' ? 'zh' : 'en'));
        const vscore = v => { const s = ((v.name || '') + ' ' + (v.voiceURI || '')).toLowerCase(); return (s.includes('premium') || s.includes('enhanced')) ? 3 : (s.includes('siri') ? 2 : 0); };
        const v = vs.sort((a, b) => vscore(b) - vscore(a))[0];
        if (v){ u.voice = v; u.lang = v.lang; } else { u.lang = deck === 'cn' ? 'zh-CN' : 'en-US'; }
        u.rate = deck === 'cn' ? 0.78 : 0.92;
        let started = false, settled = false;
        u.onstart = () => { started = true; };
        u.onend = () => { settled = true; resolve(true); };
        u.onerror = () => { if (!settled){ settled = true; resolve(false); } };
        synth.speak(u);
        setTimeout(() => { if (!settled){ settled = true; if (!started){ try { synth.cancel(); } catch(e){} resolve(false); } else resolve(true); } }, 900);
      } catch(e){ resolve(false); }
    };
    try {
      if (synth.speaking || synth.pending){ synth.cancel(); setTimeout(doSpeak, 90); }
      else doSpeak();
      if (synth.paused) synth.resume();
    } catch(e){ resolve(false); }
  });
}
async function speak(text, deck){
  text = (text || '').trim();
  if (!text) return;
  if (!edgeDead){
    try { await speakViaEdge(text, deck); return; }
    catch(e){ edgeDead = true; }
  }
  if ('speechSynthesis' in window){
    const okLocal = await speakLocal(text, deck);
    if (okLocal) return;
  }
  speakViaWeb(text, deck);
}

// ===== 穴埋め＆苦手 =====
const LEECH_MIN = 3;
let leechMode = false, leechFilterOn = false, currentCloze = null;
const CLOZE_STRIP = /^[\s（）()、，,。．？！?!…·—「」『』“”"'：:；;・]+|[\s（）()、，,。．？！?!…·—「」『』“”"'：:；;・]+$/g;
function clozeParts(word){
  const segs = String(word || '').split('~');
  const parts = [];
  for (const seg of segs){
    const opt = /^\s*[（(]/.test(seg) && /[）)]\s*$/.test(seg);
    const core = seg.replace(CLOZE_STRIP, '');
    if (core) parts.push({ text: core, optional: opt });
  }
  return parts;
}
function blankFor(text, deck){ const n = [...String(text)].length; return deck === 'en' ? '_'.repeat(n) : '＿'.repeat(n); }
function makeCloze(item, deck){
  const ex = item.example || '';
  if (!ex) return null;
  const word = String(item.word || '');
  const parts = clozeParts(word);
  if (!parts.length) return null;
  const hay = deck === 'en' ? ex.toLowerCase() : ex;
  const needle = t => deck === 'en' ? t.toLowerCase() : t;
  if (!word.includes('~') && parts.length === 1){
    const p = needle(parts[0].text);
    if (!hay.includes(p)) return null;
    let out = '', idx = 0, hit = 0;
    while (true){ const i = hay.indexOf(p, idx); if (i < 0) break; out += ex.slice(idx, i) + blankFor(parts[0].text, deck); idx = i + p.length; hit++; }
    return hit ? out + ex.slice(idx) : null;
  }
  let out = '', last = 0, pos = 0, hit = 0;
  for (const part of parts){
    const p = needle(part.text);
    const i = hay.indexOf(p, pos);
    if (i < 0){ if (part.optional) continue; return null; }
    out += ex.slice(last, i) + blankFor(part.text, deck);
    last = i + p.length; pos = last; hit++;
  }
  return hit ? out + ex.slice(last) : null;
}

// ===== GitHub sync (base-snapshot方式) =====
// ルール: 起動時 = GitHubと「前回同期した状態(base)」を比べて3方向判定。
//   GitHubが新しい & 自分が未変更 → GitHubを取り込む（削除も反映）
//   自分が未変更でない & GitHubが同じ → 自分の変更を送る
//   両方変化（同時利用）→ 単語単位マージ（進捗優先）して送る
// 利用中 = 変更のたびにプッシュのみ。
const GH_FILES = { en: 'english_vocab.json', cn: 'chinese_vocab.json' };
let ghCfg = null;
try { ghCfg = JSON.parse(localStorage.getItem('vocabGhCfg') || 'null'); } catch(e){}
function ghStatus(msg){ const el = $('ghStatus'); if (el) el.innerHTML = msg.replace(/^☁ /, ICONS.cloud + ' ').replace(/^⏳ /, ICONS.refresh + ' ').replace(/^⚠ /, ICONS.alert + ' '); }
function ghReady(){ return !!(ghCfg && ghCfg.owner && ghCfg.repo && ghCfg.token); }
function b64enc(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64dec(b64){ return decodeURIComponent(escape(atob(b64.replace(/\s/g, '')))); }

let ghBase = {}; try { ghBase = JSON.parse(localStorage.getItem('vocabGhBaseV3') || '{}'); } catch(e){}
function saveBase(){ try { localStorage.setItem('vocabGhBaseV3', JSON.stringify(ghBase)); } catch(e){} }
const SYNC_FIELDS = ['word','meaning','example','interval','next_review','reading','example_reading','lapses'];
function canon(items){
  const norm = (items || []).map(it => { const o = {}; SYNC_FIELDS.forEach(f => { o[f] = (it[f] === undefined ? (f === 'interval' ? 0 : '') : it[f]); }); return o; });
  norm.sort((a, b) => { const x = String(a.word).toLowerCase(), y = String(b.word).toLowerCase(); return x < y ? -1 : (x > y ? 1 : 0); });
  return JSON.stringify(norm);
}
function sameItems(a, b){ return canon(a) === canon(b); }
function pendingDeck(deck){ const b = ghBase[deck]; if (!b) return (data[deck] || []).length > 0; return !sameItems(data[deck], b.items); }
function anyPending(){ return ['en','cn'].some(pendingDeck); }

let syncBusy = false, syncErr = '', lastPull = 0;
let syncNotes = [];
function syncUi(){
  const p = $('syncPill'); if (!p) return;
  if (!ghReady()) p.innerHTML = ICONS.cloud + ' 未設定';
  else if (syncBusy) p.innerHTML = ICONS.refresh + ' 同期中…';
  else if (syncErr) p.innerHTML = ICONS.alert + ' 失敗（タップで再試行）';
  else if (anyPending()) p.innerHTML = ICONS.up + ' 未送信あり（タップで同期）';
  else p.innerHTML = ICONS.cloud + ' 同期済み';
}

async function ghApi(method, file, payload){
  const url = 'https://api.github.com/repos/' + ghCfg.owner + '/' + ghCfg.repo + '/contents/' + file + (method === 'GET' ? ('?ref=' + (ghCfg.branch || 'main') + '&_=' + Date.now()) : '');
  const opt = { method: method, headers: { 'Authorization': 'Bearer ' + ghCfg.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } };
  if (method === 'GET') opt.cache = 'no-store';
  if (payload){ opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(payload); }
  const res = await fetch(url, opt);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('GitHub API ' + res.status);
  return res.json();
}
async function ghGet(file){
  const j = await ghApi('GET', file);
  if (!j) return null;
  return { items: JSON.parse(b64dec(j.content)), sha: j.sha };
}
async function ghPut(file, items, sha){
  const payload = { message: 'sync ' + file, content: b64enc(JSON.stringify(items, null, 2)), branch: ghCfg.branch || 'main' };
  if (sha) payload.sha = sha;
  const j = await ghApi('PUT', file, payload);
  if (!j) throw new Error('GitHub API 404（リポジトリが見えていません）');
  return j && j.content ? j.content.sha : null;
}

function mergeVocab(localItems, remoteItems){
  const key = it => String(it.word || '').toLowerCase();
  const score = it => [it.interval || 0, String(it.next_review || '')];
  const rmap = {}; remoteItems.forEach(it => rmap[key(it)] = it);
  const seen = {}; const out = [];
  localItems.forEach(it => { const k = key(it); seen[k] = 1; const r = rmap[k];
    if (r && (score(r)[0] > score(it)[0] || (score(r)[0] === score(it)[0] && score(r)[1] >= score(it)[1]))) out.push(r); else out.push(it); });
  remoteItems.forEach(it => { if (!seen[key(it)]) out.push(it); });
  return out;
}

let pushTimers = {};
function markDirty(deck){
  syncUi();
  if (!ghReady()) return;
  clearTimeout(pushTimers[deck]);
  pushTimers[deck] = setTimeout(() => pushDeck(deck), 1200);
}

function progressRegressions(items, remoteItems){
  const key = it => String(it.word || '').toLowerCase();
  const score = it => [it.interval || 0, String(it.next_review || '')];
  const map = {}; items.forEach(it => map[key(it)] = it);
  const bad = [];
  remoteItems.forEach(r => { const l = map[key(r)]; if (!l) return; const a = score(l), b = score(r);
    if (a[0] < b[0] || (a[0] === b[0] && a[1] < b[1])) bad.push(r.word); });
  return bad;
}

// 送信リトライ: 一時的な失敗（回線断・5xx・競合）は間隔を空けて自動で再試行する。
// 再試行のたびに新鮮さゲート（再取得→進捗優先マージ→push）を最初から回すので、
// 古いSHAでの盲目的な再PUTにはならない。
const PUSH_RETRY_DELAYS = [2000, 5000, 15000];
function sleepMs(ms){ return new Promise(r => setTimeout(r, ms)); }
function retryableSyncErr(e){
  const m = String((e && e.message) || e);
  if (m.includes('進捗リグレッション')) return false; // 安全停止はリトライしない
  const mm = m.match(/GitHub API (\d{3})/);
  if (mm){ const s = parseInt(mm[1], 10); return s >= 500 || s === 409 || s === 422 || s === 429; }
  return true; // fetch自体の失敗（ネットワークエラー等）は再試行する
}

async function pushDeck(deck, shaOverride){
  if (!ghReady()) return;
  const file = GH_FILES[deck];
  syncBusy = true; syncUi();
  let lastErr = null;
  for (let attempt = 0; attempt <= PUSH_RETRY_DELAYS.length; attempt++){
    const base = ghBase[deck];
    // shaOverride は初回のみ使う（競合後の再試行ではゲートが取る最新のSHAを使う）
    let sha = (attempt === 0 && shaOverride !== undefined) ? shaOverride : (base ? base.sha : undefined);
    try {
      // 楽観的PUT: baseのSHAを付けた送信は、サーバーがbaseから動いていれば
      // GitHub自身が409で弾くので、全件取得ゲートなしでも上書き事故は起きない。
      // リモートが動いていた場合（409/422）だけ従来のゲート経路へ落とす。
      if (attempt === 0 && shaOverride === undefined && base && base.sha){
        try {
          const fastSha = await ghPut(file, data[deck], base.sha);
          ghBase[deck] = { sha: fastSha, items: JSON.parse(JSON.stringify(data[deck])) };
          saveBase(); syncErr = '';
          ghStatus('☁ 同期済み ' + new Date().toLocaleTimeString());
          syncBusy = false; syncUi();
          return;
        } catch(eFast){
          const mf = String((eFast && eFast.message) || eFast);
          if (!/GitHub API (409|422)/.test(mf)) throw eFast; // 回線断などは外側のリトライへ
          // 409/422 = リモートが動いていた → このままゲート経路へ
        }
      }
      // 新鮮さゲート（進捗リグレッション防止）: 送信直前にGitHubの現状を取り直す。
      // 前回同期(base)からGitHubが動いていたら、そのまま上書きせず進捗優先マージしてから送る。
      let itemsToPush = data[deck];
      let gateMerged = false;
      const remote = await ghGet(file);
      if (remote){
        if (!base || remote.sha !== base.sha){
          if (!sameItems(remote.items, itemsToPush)){
            itemsToPush = mergeVocab(itemsToPush, remote.items);
            gateMerged = true;
          }
          sha = remote.sha;
        }
        const bad = progressRegressions(itemsToPush, remote.items);
        if (bad.length) throw new Error('進捗リグレッション防止のため送信を中止しました（' + bad.length + '語）');
      }
      const newSha = await ghPut(file, itemsToPush, sha);
      if (gateMerged){ data[deck] = itemsToPush; save(); if (mode === 'list') renderList(); }
      ghBase[deck] = { sha: newSha, items: JSON.parse(JSON.stringify(itemsToPush)) };
      saveBase(); syncErr = '';
      ghStatus(gateMerged ? '☁ 競合をマージして同期しました' : '☁ 同期済み ' + new Date().toLocaleTimeString());
      syncBusy = false; syncUi();
      return;
    } catch(e) {
      lastErr = e;
      if (attempt < PUSH_RETRY_DELAYS.length && retryableSyncErr(e)){
        ghStatus('⏳ 同期を再試行中…（' + (attempt + 1) + '回目）');
        await sleepMs(PUSH_RETRY_DELAYS[attempt]);
        continue;
      }
      break;
    }
  }
  // リトライし尽くした場合: ghBaseを更新しないので「未送信」のまま残り、学習記録は失われない
  syncErr = lastErr ? lastErr.message : 'unknown';
  ghStatus('⚠ 同期に失敗（' + syncErr + '）次回開いたときに再同期します');
  syncBusy = false; syncUi();
}
async function syncDeck(deck){
  const file = GH_FILES[deck];
  const base = ghBase[deck];
  const remote = await ghGet(file);
  if (!remote){
    if ((data[deck] || []).length) await pushDeck(deck);
    else { ghBase[deck] = { sha: null, items: [] }; saveBase(); syncNotes.push((deck === 'cn' ? '中国語' : '英語') + ': GitHubにファイルが見つかりません（404）'); }
    return;
  }
  if (!(data[deck] || []).length && remote.items.length){
    // 手元が空でGitHubに単語がある場合は、状態が壊れているとみなしてGitHubを正とする（空のまま送信しない）
    data[deck] = remote.items; save();
    ghBase[deck] = { sha: remote.sha, items: JSON.parse(JSON.stringify(remote.items)) };
    saveBase(); return;
  }
  if (!base){
    // 初回(v3): GitHubの名簿を正とし、手元だけにある単語は取り込まない（旧方式の残骸を掃除）。
    // 共有単語は進捗が進んでいる方を残す。
    const key = it => String(it.word || '').toLowerCase();
    const score = it => [it.interval || 0, String(it.next_review || '')];
    const lmap = {}; (data[deck] || []).forEach(it => lmap[key(it)] = it);
    const merged0 = remote.items.map(r => { const l = lmap[key(r)]; return (l && (score(l)[0] > score(r)[0] || (score(l)[0] === score(r)[0] && score(l)[1] > score(r)[1]))) ? l : r; });
    if (sameItems(merged0, remote.items)){
      data[deck] = remote.items; save();
      ghBase[deck] = { sha: remote.sha, items: JSON.parse(JSON.stringify(remote.items)) };
      saveBase(); return;
    }
    data[deck] = merged0; save();
    await pushDeck(deck, remote.sha);
    return;
  }
  const localChanged = !sameItems(data[deck], base.items);
  const remoteChanged = base.sha !== remote.sha;
  if (!remoteChanged && !localChanged) return;
  if (!remoteChanged && localChanged){ await pushDeck(deck); return; }
  if (remoteChanged && !localChanged){
    data[deck] = remote.items; save();
    ghBase[deck] = { sha: remote.sha, items: JSON.parse(JSON.stringify(remote.items)) };
    saveBase(); return;
  }
  const merged = mergeVocab(data[deck], remote.items);
  data[deck] = merged; save();
  await pushDeck(deck, remote.sha);
}

async function syncPullAll(){
  if (!ghReady()){ ghStatus('未設定：ローカル保存のみで動作中'); syncUi(); return; }
  syncBusy = true; syncUi(); lastPull = Date.now();
  ghStatus('☁ 同期中…');
  syncNotes = [];
  const errs = [];
  for (const deck of ['en','cn']){ try { await syncDeck(deck); } catch(e){ errs.push((deck === 'cn' ? '中国語' : '英語') + ': ' + e.message); } }
  const err = errs.join(' ／ ');
  syncBusy = false;
  if (err){ syncErr = err; ghStatus('⚠ 同期失敗（' + err + '）'); }
  else if (syncNotes.length){ syncErr = ''; ghStatus('⚠ ' + syncNotes.join(' ／ ') + '（owner・repo・トークンの権限を確認してね）'); }
  else { syncErr = ''; ghStatus(anyPending() ? '📤 未送信の変更があります（タップで同期）' : '☁ 同期完了 ' + new Date().toLocaleTimeString()); }
  syncUi();
}

async function forcePullAll(){
  if (!ghReady()) return;
  for (const deck of ['en','cn']){
    try { const remote = await ghGet(GH_FILES[deck]); if (remote){ data[deck] = remote.items; ghBase[deck] = { sha: remote.sha, items: JSON.parse(JSON.stringify(remote.items)) }; } } catch(e){}
  }
  save(); saveBase(); syncUi();
}

function fillGhForm(){
  if (!ghCfg) return;
  $('ghOwner').value = ghCfg.owner || ''; $('ghRepo').value = ghCfg.repo || '';
  $('ghToken').value = ghCfg.token || ''; $('ghBranch').value = ghCfg.branch || '';
}
function applyGhForm(){
  ghCfg = { owner: $('ghOwner').value.trim(), repo: $('ghRepo').value.trim(), token: $('ghToken').value.trim(), branch: $('ghBranch').value.trim() || 'main' };
  try { localStorage.setItem('vocabGhCfg', JSON.stringify(ghCfg)); } catch(e){}
  return ghReady();
}
function formDiffersFromCfg(){
  const o = $('ghOwner').value.trim(), r = $('ghRepo').value.trim(), t = $('ghToken').value.trim(), b = $('ghBranch').value.trim() || 'main';
  if (!ghCfg) return !!(o || r || t);
  return o !== (ghCfg.owner || '') || r !== (ghCfg.repo || '') || t !== (ghCfg.token || '') || b !== (ghCfg.branch || 'main');
}
$('ghSave').addEventListener('click', async () => {
  if (applyGhForm()){ await syncPullAll(); if (mode === 'list') renderList(); current = null; nextCard(); }
  else ghStatus('入力が不足しています');
  syncUi();
});
$('ghSyncNow').addEventListener('click', async () => { if (formDiffersFromCfg()) applyGhForm(); await syncPullAll(); if (mode === 'list') renderList(); else { current = null; nextCard(); } });
fillGhForm();
syncUi();

$('syncPill').addEventListener('click', async () => {
  if (!ghReady()){ document.querySelector('[data-mode="list"]').click(); setTimeout(() => $('ghForm').scrollIntoView({behavior:'smooth'}), 80); return; }
  if (formDiffersFromCfg()) applyGhForm();
  await syncPullAll();
  if (mode === 'list') renderList(); else { current = null; nextCard(); }
});

  if (mode === 'en' || mode === 'cn') listDeck = mode;
  lastAutoReadingL = ''; lastAutoReadingR = ''; lastAutoExReading = '';

  $('addModal').classList.add('on');
  setTimeout(() => { try { $('fWordL').focus({preventScroll:true}); } catch(e){} }, 60);

function closeAddModal(){ $('addModal').classList.remove('on'); }
$('fabAdd').addEventListener('click', openAddModal);
$('addClose').addEventListener('click', closeAddModal);
$('addModal').addEventListener('click', e => { if (e.target === $('addModal')) closeAddModal(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && ghReady() && !syncBusy && (anyPending() || Date.now() - lastPull > 60000)) syncPullAll(); });
window.addEventListener('online', () => { if (ghReady() && !syncBusy) syncPullAll(); });

(async () => { await syncPullAll(); nextCard(); syncUi(); })();
